# UBI volumes. Fixed IDs, so the volumes always have the same /dev/ubi0_<id>:
# 0 env, 1 env_r, 2 kernel_a, 3 kernel_b, 4 rootfs_a, 5 rootfs_b, 6 data,
# 7 splash. A fresh install has slot A only: the first update creates kernel_b
# and rootfs_b (ubinize can't make an empty static volume), and
# flash-fastboot.sh creates the splash.
# Volume sizes must match flash-fastboot.sh

[env]
mode=ubi
vol_id=0
vol_type=dynamic
vol_name=env
vol_size=126976

[env_r]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=env_r
vol_size=126976

[kernel_a]
mode=ubi
vol_id=2
vol_type=static
vol_name=kernel_a
vol_size=8MiB
image=kernel.itb

[rootfs_a]
mode=ubi
vol_id=4
vol_type=dynamic
vol_name=rootfs_a
vol_size=32MiB
image=rootfs.ubifs

# Formatted by the kernel on the first mount
[data]
mode=ubi
vol_id=6
vol_type=dynamic
vol_name=data
vol_size=100MiB
