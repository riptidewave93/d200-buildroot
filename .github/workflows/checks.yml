name: Checks

# Quick checks without a full build (scripts/check.sh), on every pull request
# and every push to main
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        check: [lint, config, patches]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Restore the download cache
        if: matrix.check == 'patches'
        uses: actions/cache/restore@v6
        with:
          path: preserve/dl
          key: dl-release-${{ hashFiles('Makefile', 'configs/*', 'board/ulanzi/d200/*.fragment', 'package/*/*.mk') }}
          restore-keys: |
            dl-release-
            dl-

      - name: make check-${{ matrix.check }}
        run: make check-${{ matrix.check }}
