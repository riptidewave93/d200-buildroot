name: Release

# Builds both flavours and signs their update bundles with the
# D200_SIGNING_KEY secret (docs/ota.md#signing). Called by Release Please for
# a new release, it attaches the files and their SHA-256 sums to that
# release; run by hand, it only builds and keeps them as artifacts.
on:
  workflow_call:
    inputs:
      tag:
        description: The release to attach the files to
        type: string
        required: true
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        flavor: [release, debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # the version comes from git describe, U-Boot's date from git log

      - name: Restore the download cache
        uses: actions/cache/restore@v6
        with:
          path: preserve/dl
          key: dl-${{ matrix.flavor }}-${{ hashFiles('Makefile', 'configs/*', 'board/ulanzi/d200/*.fragment', 'package/*/*.mk') }}
          restore-keys: |
            dl-${{ matrix.flavor }}-
            dl-

      - name: Build
        env:
          D200_SIGNING_KEY: ${{ secrets.D200_SIGNING_KEY }}
        run: make build FLAVOR=${{ matrix.flavor }}

      - name: Save the download cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: preserve/dl
          key: dl-${{ matrix.flavor }}-${{ hashFiles('Makefile', 'configs/*', 'board/ulanzi/d200/*.fragment', 'package/*/*.mk') }}

      - uses: actions/upload-artifact@v7
        with:
          name: d200-${{ matrix.flavor }}
          path: |
            output/*/d200-*.zip
            output/*/d200-*-maskrom.tar.xz
            output/*/d200-*-update.tar
          if-no-files-found: error

  release:
    if: inputs.tag
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check the update bundles are signed
        run: |
          for f in dist/*-update.tar; do
            tar -tf "$f" | grep -qx manifest.sig || { echo "$f is not signed"; exit 1; }
          done

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd dist
          sha256sum -- d200-* > SHA256SUMS
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" -- d200-* SHA256SUMS
