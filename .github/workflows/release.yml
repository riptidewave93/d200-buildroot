name: Release

# On a version tag: build both flavours, sign their update bundles with the
# D200_SIGNING_KEY secret (docs/ota.md#signing) and attach them to a draft
# GitHub release. Run by hand, it only builds; the files stay as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        flavor: [release, debug]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version comes from git describe, U-Boot's date from git log

      - name: Restore the download cache
        uses: actions/cache/restore@v6
        with:
          path: preserve/dl
          key: dl-${{ matrix.flavor }}-${{ hashFiles('Makefile', 'configs/*', 'board/ulanzi/d200/*.fragment', 'package/*/*.mk') }}
          restore-keys: |
            dl-${{ matrix.flavor }}-
            dl-

      - name: Build
        env:
          D200_SIGNING_KEY: ${{ secrets.D200_SIGNING_KEY }}
        run: make build FLAVOR=${{ matrix.flavor }}

      - name: Save the download cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: preserve/dl
          key: dl-${{ matrix.flavor }}-${{ hashFiles('Makefile', 'configs/*', 'board/ulanzi/d200/*.fragment', 'package/*/*.mk') }}

      - uses: actions/upload-artifact@v7
        with:
          name: d200-${{ matrix.flavor }}
          path: |
            output/*/d200-*.tar.gz
            output/*/d200-*-update.tar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check the update bundles are signed
        run: |
          for f in dist/*-update.tar; do
            tar -tf "$f" | grep -qx manifest.sig || { echo "$f is not signed"; exit 1; }
          done

      - name: Draft a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum d200-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --generate-notes d200-* SHA256SUMS
